name: Stock Checker

on:
  workflow_dispatch:         # manual run from Actions tab
    inputs:
      seed_mode:
        description: "Rebuild state from a live scrape without sending Telegram alerts (one-off baseline reset)"
        type: boolean
        default: false
  repository_dispatch:       # triggered by cron-job.org every 5 minute
    types: [run-checker]

concurrency:
  group: stock-checker
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write        # needed to commit state.json back

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SEED_MODE:          ${{ github.event.inputs.seed_mode || 'false' }}
        run: python bot/main.py

      - name: Commit updated state
        run: |
          git config user.name  "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "Chore: Updated state after stock check"
          git push